<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005A9E;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 4 Windows panes with rounded corners -->
  <rect x="20" y="20" width="72" height="72" rx="12" fill="url(#winGrad)" />
  <rect x="108" y="20" width="72" height="72" rx="12" fill="url(#winGrad)" />
  <rect x="20" y="108" width="72" height="72" rx="12" fill="url(#winGrad)" />
  <rect x="108" y="108" width="72" height="72" rx="12" fill="url(#winGrad)" />
  <!-- Subtle inner shadow effect -->
  <rect x="20" y="20" width="72" height="72" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <rect x="108" y="20" width="72" height="72" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <rect x="20" y="108" width="72" height="72" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <rect x="108" y="108" width="72" height="72" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
</svg>
